name: image-test

# Runs the published image through the smoke test on demand (and daily, to catch a broken :latest).
on:
  workflow_dispatch:
  schedule:
    - cron: "41 5 * * *"

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: BRIDGE_CMD='["docker","run","-i","--rm","ghcr.io/gpunz/gpunz-mcp:latest"]' node test.js
